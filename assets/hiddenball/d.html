<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1980-2022 RAW DATA · pipeline</title>
<style>
/* =====================================================================
   TABLE OF CONTENTS
   1. Theme & reset
   2. Shared elements
   3. Scroll wrapper & wires (SVG connector layer)
   4. Top node column (title / compression / decades / ranges / year / leagues)
   5. Timeline segments (decade + 5-year grid)
   6. Year chip & league badges
   7. Schema tree (nested expandable list)
   8. Core box (root node)
   9. Branch columns (category cards either side of the spine)
   10. Sub-year chips
   11. League row layout (AL / NL two-column split)
   12. Outer decoration spine (icon boxes beside each card)
   13. Responsive
   ===================================================================== */

/* ---------------------------------------------------------------------
   1. THEME & RESET
   --------------------------------------------------------------------- */
:root{
  --bg:#ffffff;
  --fg:#1c2430;
  --mute:#5f6979;
  --line:#c5d0e4;
  --chip:#eef2f6;
}
*{
  box-sizing:border-box;
}
html,body{
  margin:0;
}
body{
  background:var(--bg);
  color:var(--fg);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{
  max-width:none;
  margin:0 auto;
  padding:56px 28px 96px;
}

/* ---------------------------------------------------------------------
   2. SHARED ELEMENTS
   --------------------------------------------------------------------- */
/* shared dot marker used everywhere as a bullet/icon */
.d{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--c,#2d4f9c);
  flex:none;
}

/* ---------------------------------------------------------------------
   3. SCROLL WRAPPER & WIRES
   horizontal-scroll shell wrapping the whole diagram;
   one SVG carries every wire on the page
   --------------------------------------------------------------------- */
.scroll{
  overflow-x:auto;
  padding:4px 4px 16px;
}
.inner{
  position:relative;
  width:max-content;
  min-width:100%;
}
.wires{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:visible;
}
.wires path{
  fill:none;
  stroke-width:1.5;
  opacity:.6;
}

/* ---------------------------------------------------------------------
   4. TOP NODE COLUMN
   title -> compression -> decades/ranges/year/leagues
   --------------------------------------------------------------------- */
.top{
  position:relative;
  width:940px;
  margin:0 auto;
}
.node{
  text-align:center;
}
.node>.d{
  display:block;
  margin:0 auto;
  --c:#2d4f9c;
}
.node h2{
  margin:10px 0 0;
  font-size:15px;
  font-weight:600;
}
.node h2 small{
  font-weight:400;
  font-size:.85em;
  color:var(--mute);
  margin-left:6px;
}
.node .titleRow{
  position:relative;
  width:460px;
  margin:0 auto;
}
.node .titleRow h2{
  margin:10px 0 0;
  text-align:center;
}
.node .size{
  position:absolute;
  right:0;
  top:50%;
  transform:translateY(-50%);
  font-weight:400;
  font-size:.85em;
  color:var(--mute);
}
.vol.vert .vlabel{
  font-size:13px;
  font-weight:600;
  color:var(--fg);
}
.node .vol,.node .scale{
  width:460px;
  margin:0 auto;
}
.vl{
  width:1.5px;
  height:30px;
  margin:12px auto 0;
  background:var(--line);
}

.vol{
  display:flex;
  align-items:center;
  margin-top:14px;
}
.vol.vert{
  flex-direction:column;
  align-items:center;
  gap:8px;
  width:130px;
  margin:14px auto 0;
}
.bar{
  flex:1;
  height:34px;
  border-radius:8px;
  background:#2d4f9c;
  mask:repeating-linear-gradient(90deg,#000 0 3px,transparent 3px 7px);
}
.bar.s{
  flex:none;
  width:26%;
  mask:repeating-linear-gradient(90deg,#000 0 3px,transparent 3px 4px);
}
.vol.vert .bar.s{
  width:42%;
  height:22px;
}
.funnel{
  width:64px;
  height:34px;
  flex:none;
  margin:0 6px;
  background:color-mix(in srgb,#2d4f9c 22%,transparent);
  clip-path:polygon(0 0,100% 32%,100% 68%,0 100%);
}
.funnel.v{
  width:100%;
  height:58px;
  margin:0;
  clip-path:polygon(0 0,100% 0,68% 100%,32% 100%);
}
.scale{
  display:flex;
  justify-content:space-between;
  color:var(--mute);
  font-size:12px;
  margin-top:6px;
}

.fan{
  height:64px;
}
/* the decade-labeling fan needs more vertical room than the generic
   .fan spacer gives it: it splits into 5 branches spread across the
   full 940px row, so the curves need space to spread smoothly instead
   of hooking sharply right above the boxes */
#fan{
  height:150px;
}
.gap{
  height:56px;
}
#decades+.gap{
  height:170px;
}
.cap{
  position:absolute;
  left:-146px;
  width:130px;
  text-align:right;
  color:var(--mute);
  font-size:13px;
  line-height:1.35;
  padding-top:10px;
}
.cap.dot{
  left:0;
  width:max-content;
  text-align:center;
  padding:0 8px;
  color:var(--fg);
  font-weight:600;
  background:var(--bg);
  transform:translate(-50%,-100%);
  line-height:1.3;
  white-space:nowrap;
}

/* ---------------------------------------------------------------------
   5. TIMELINE SEGMENTS
   decade / 5-year timeline segments (44-col grid; the translateX nudge
   lines the grid up with the .top column above it - tune here if either
   width changes)
   --------------------------------------------------------------------- */
.tl{
  display:grid;
  grid-template-columns:repeat(44,minmax(0,1fr));
  width:940px;
  min-width:0;
  transform:translateX(-10.68px);
}
.seg{
  grid-column:span var(--w);
  margin:0 2px;
  padding:9px 10px 10px;
  border-radius:8px;
  border-top:3px solid var(--c);
  background:color-mix(in srgb,var(--c) 11%,var(--chip));
  font-size:13.5px;
  line-height:1.35;
}
.seg b{
  font-weight:500;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  white-space:nowrap;
}
.seg em{
  display:block;
  font-style:normal;
  color:var(--mute);
  font-size:12px;
  margin-top:2px;
}
.seg.on{
  box-shadow:0 0 0 2px #2d4f9c;
}

/* ---------------------------------------------------------------------
   6. YEAR CHIP & LEAGUE BADGES
   single-year chip + the two league boxes that branch out of it
   --------------------------------------------------------------------- */
.years{
  display:flex;
  gap:4px;
  width:max-content;
  max-width:420px;
  margin:14px auto 0;
  --c:#4a6cb3;
}
.years span{
  flex:1;
  text-align:center;
  padding:7px 22px;
  border-radius:8px;
  border-top:3px solid var(--c);
  background:color-mix(in srgb,var(--c) 11%,var(--chip));
  font-size:13px;
  color:var(--mute);
}
#divisions .years span{
  flex:none;
  width:72px;
  padding:7px 0;
}
.years .on{
  color:var(--fg);
  font-weight:600;
  box-shadow:0 0 0 2px #2d4f9c;
}
.leagues{
  display:flex;
  gap:16px;
  width:max-content;
  margin:0 auto;
}
.league{
  padding:8px 18px;
  border-radius:8px;
  border-top:3px solid var(--c);
  background:color-mix(in srgb,var(--c) 11%,var(--chip));
  font-size:13px;
  font-weight:600;
  color:var(--fg);
}

/* ---------------------------------------------------------------------
   7. SCHEMA TREE
   nested <ul>, expandable groups
   --------------------------------------------------------------------- */
.tree{
  margin-top:44px;
}
.tree ul{
  list-style:none;
  margin:0;
  padding-left:0;
}
.tree li.grp>ul{
  padding-left:14px;
}
.tree li{
  position:relative;
  padding:4px 0;
}
.tree li.x{
  display:none;
}

/* "More" overlay panel: the extra items render inside their own <ul class="extra">,
   hidden by default. When opened it becomes position:absolute (relative to the
   .m <li> that holds the button) so it floats on top of whatever sits below it
   instead of pushing that content down. It self-closes (JS) on scroll or when
   the pointer leaves the area. */
.tree li.m{
  position:relative;
}
.tree ul.extra{
  display:none;
}
.tree li.m.open ul.extra{
  display:block;
  position:absolute;
  left:-14px;
  right:-14px;
  top:100%;
  margin-top:2px;
  padding:6px 14px 8px;
  background:var(--bg);
  border:1.5px solid var(--line);
  border-radius:10px;
  box-shadow:0 10px 28px rgba(0,0,0,.16);
  z-index:60;
  animation:more-in .14s ease-out;
}
@keyframes more-in{
  from{opacity:0;transform:translateY(-4px)}
  to{opacity:1;transform:translateY(0)}
}

.n{
  display:inline-flex;
  align-items:center;
  gap:9px;
  line-height:22px;
}
.n .d{
  width:7px;
  height:7px;
  margin-top:8px;
}
.n.g{
  color:var(--mute);
  font-size:13.5px;
}


.cat>.n{
  align-items:center;
  white-space:nowrap;
  padding:3px 12px 3px 10px;
  border-radius:999px;
  background:color-mix(in srgb,var(--c) 12%,transparent);
  font-weight:600;
  cursor:pointer;
  user-select:none;
  transition:background-color .12s ease;
}
.cat>.n:hover{
  background:color-mix(in srgb,var(--c) 20%,transparent);
}
.cat>.n .d{
  width:10px;
  height:10px;
  margin-top:0;
}
.cat>.n span{
  font:400 12px ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--mute);
  margin-left:2px;
}
.cat.off>ul{
  display:none;
}

.m{
  padding-top:2px!important;
}

.m button{
  font:inherit;
  font-size:12px;
  color:var(--mute);
  background:none;
  border:1px solid var(--line);
  border-radius:999px;
  padding:1px 10px;
  cursor:pointer;
}
.m button:hover{
  color:var(--fg);
  border-color:var(--mute);
}
button:focus-visible,.cat>.n:focus-visible{
  outline:2px solid var(--fg);
  outline-offset:2px;
  border-radius:6px;
}

/* ---------------------------------------------------------------------
   8. CORE BOX
   root (the CORE box) sitting at the upper center, aligned with the
   top row of each league
   --------------------------------------------------------------------- */
.core{
  position:absolute;
  left:0;
  top:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:max-content;
  padding:18px;
  border-radius:18px;
  background:var(--chip);
  border:1.5px solid #2d4f9c;
  box-shadow:0 0 0 7px color-mix(in srgb,#2d4f9c 8%,transparent);
}
.core .ic{
  width:68px;
  height:68px;
  border-radius:12px;
  overflow:hidden;
  display:flex;
}
.core .label{
  margin-bottom:10px;
  font-size:13px;
  font-weight:700;
  letter-spacing:.04em;
  text-align:center;
  color:var(--fg);
  white-space:nowrap;
}
.subBox{
  position:absolute;
  left:0;
  top:0;
  display:flex;
  align-items:center;
  justify-content:center;
  width:max-content;
  padding:18px 24px;
  border-radius:18px;
  background:var(--chip);
  border:1.5px solid #2d4f9c;
  box-shadow:0 0 0 7px color-mix(in srgb,#2d4f9c 8%,transparent);
  font-size:15px;
  font-weight:600;
  white-space:nowrap;
}
.subBox .icons{
  display:flex;
  gap:14px;
}
.subBox .icons svg{
  width:38px;
  height:38px;
  display:block;
}
.core .ic svg{
  width:100%;
  height:100%;
  display:block;
}

/* ---------------------------------------------------------------------
   9. BRANCH COLUMNS
   categories split into a left group and a right group with one
   vertical spine between them - each card wires to the spine, not to
   each other
   --------------------------------------------------------------------- */
.branches{
  display:flex;
  gap:70px;
  justify-content:center;
  align-items:stretch;
}
.col{
  display:flex;
  flex-direction:column;
  gap:16px;
  width:250px;
}
.spine{
  width:1.5px;
}
.cat{
  position:relative;
  flex:none;
  padding:12px 14px 10px;
  border:1.5px solid color-mix(in srgb,var(--c) 40%,transparent);
  border-radius:16px;
  background:var(--chip);
}
li.grp:not(.gopen)>ul{
  display:none;
}
li.grp.gopen>ul,
.cat:not(.off)>ul{
  animation:reveal-in .16s ease-out;
}
@keyframes reveal-in{
  from{opacity:0;transform:translateY(-3px)}
  to{opacity:1;transform:translateY(0)}
}
li.grp>.n{
  cursor:pointer;
  user-select:none;
  border-radius:6px;
  transition:background-color .12s ease;
}
li.grp>.n:hover{
  background:color-mix(in srgb,var(--c,var(--mute)) 10%,transparent);
}
li.grp .ct{
  align-self:center;
  margin-top:0;
  font:400 11px ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--mute);
  margin-left:2px;
}

/* ---------------------------------------------------------------------
   10. SUB-YEAR CHIPS
   sub-year chips (2001-2005) that hang off the 2000-2005 range segment
   --------------------------------------------------------------------- */
.years.sub{
  margin-top:10px;
}
.years.sub span{
  padding:5px 12px;
  font-size:11.5px;
}

/* ---------------------------------------------------------------------
   11. LEAGUE ROW LAYOUT
   American League / National League: two full-width copies of every
   section, one on each side, with the shared hub box centered between
   them
   --------------------------------------------------------------------- */
.leagueRow{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  gap:16px;
}
.leagueBlock{
  width:540px;
  flex:none;
}
.leagueBlock .leagues{
  margin:0 auto 46px;
}
.leagueBlock .branches{
  display:flex;
  gap:24px;
  justify-content:center;
  align-items:stretch;
}
.leagueBlock .col{
  width:244px;   /* 200 card + 10 gap + 34 icon box */
}
/* every section card is the same width; outer cards hug the spine */
.col>.cat,
.catRow .cat{
  flex:none;
  width:200px;
}
#colLeftAL{
  align-items:flex-end;
}
#colRightNL{
  align-items:flex-start;
}
.hubMid{
  flex:none;
  width:290px;
}

/* ---------------------------------------------------------------------
   12. OUTER DECORATION SPINE
   a second spine running beside the inner column of each league, with
   a small json-icon box sitting between the line and every section
   card in that column
   --------------------------------------------------------------------- */
.spine2{
  display:none;
}
.catRow{
  display:flex;
  align-items:center;
  gap:10px;
}
.catRow.rev{
  flex-direction:row-reverse;
}
.catRow .cat{
  flex:1;
  min-width:0;
}
.ibox{
  width:34px;
  height:34px;
  border-radius:9px;
  flex:none;
  background:var(--chip);
  border:1.5px solid #2d4f9c;
  display:flex;
  align-items:center;
  justify-content:center;
}
.ibox svg{
  width:20px;
  height:20px;
  display:block;
}

/* ---------------------------------------------------------------------
   13. RESPONSIVE
   --------------------------------------------------------------------- */
@media(max-width:600px){
  main{
    padding:40px 16px 64px;
  }
}

/* decade boxes hug their text, centred over the span they cover */
#decades .seg{
  justify-self:center;
}

/* ---------------------------------------------------------------------
   SECTION DROPDOWN
   an opened section floats over the page (position:absolute) instead of
   pushing the layout, so every box and wire stays exactly where it is
   --------------------------------------------------------------------- */
.cat:not(.off){
  z-index:50;
}
.cat.up:not(.off)>ul{
  top:auto;
  bottom:calc(100% + 6px);
}
/* while a dropdown is open, spare room under the diagram keeps it from
   being clipped by the scroll wrapper (negative margin keeps layout fixed) */
.scroll.pad{
  padding-bottom:376px;
  margin-bottom:-360px;
}
.cat:not(.off)>ul{
  position:absolute;
  left:0;
  top:calc(100% + 6px);
  width:270px;
  margin:0;
  padding:8px 12px 10px 12px;
  background:var(--bg);
  border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);
  border-radius:12px;
  box-shadow:0 10px 28px rgba(0,0,0,.18);
  z-index:60;
}
</style>
</head>
<body>
<main>
<div class="scroll" id="scroll"><div class="inner" id="inner">
  <svg class="wires" id="wires"></svg>
  <div class="top" id="top">
    <div class="node"><i class="d"></i>
      <div class="titleRow"><h2>1980-2022 RAW DATA</h2><span class="size">171 GB</span></div>
      <div class="vol"><div class="bar"></div></div>
      <div class="scale"><span>1980</span><span>2022</span></div></div>
    <div class="vl"></div>
    <div class="node"><i class="d"></i>
      <div class="vol vert"><div class="funnel v"></div><div class="vlabel">Compressed data</div><div class="bar s"></div></div></div>
    <div class="vl"></div>
    <div class="fan" id="fan"></div>
    <div class="cap dot" id="cap1">Decade labeling</div>
    <div id="decades"></div>
    <div class="gap"></div>
    <div class="cap dot" id="cap2">5y labeling</div>
    <div id="ranges"></div>
    <div class="gap"></div>
    <div id="subyears"></div>
    <div class="gap"></div>
    <div id="divisions"></div>
    <div class="fan" id="yearFan"></div>
  </div>
  <div class="tree">
    <div class="leagueRow">
      <div class="leagueBlock" id="alBlock">
        <div id="leagueAL"></div>
        <div class="branches">
          <div class="col" id="colLeftAL"></div>
          <div class="spine" id="spineAL"></div>
          <div class="col" id="colRightAL"></div>
          <div class="spine2" id="spineAL2"></div>
        </div>
      </div>
      <div class="hubMid" id="hubMid">
        <div class="core" id="coreBox">
          <div class="label">DATA MAPPING CORE</div>
          <div class="ic"><svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <rect x="2" y="2" width="28" height="28" fill="#FFCA28"></rect> <path d="M19 25.2879L21.0615 23.9237C21.2231 24.4313 22.2462 25.6368 23.5385 25.6368C24.8308 25.6368 25.4308 24.931 25.4308 24.463C25.4308 23.1878 24.1112 22.7382 23.4774 22.5223C23.374 22.4871 23.289 22.4581 23.2308 22.4328C23.2009 22.4198 23.1558 22.4025 23.0979 22.3804C22.393 22.1111 19.7923 21.1175 19.7923 18.2373C19.7923 15.065 22.8538 14.7002 23.5462 14.7002C23.9991 14.7002 26.1769 14.7557 27.2615 16.7939L25.2615 18.1898C24.8231 17.3015 24.0946 17.0081 23.6462 17.0081C22.5385 17.0081 22.3077 17.8201 22.3077 18.1898C22.3077 19.227 23.5112 19.6919 24.5273 20.0844C24.7932 20.1871 25.0462 20.2848 25.2615 20.3866C26.3692 20.91 28 21.7666 28 24.463C28 25.8136 26.8672 28.0002 24.0154 28.0002C20.1846 28.0002 19.1692 25.7003 19 25.2879Z" fill="#3E3E3E"></path> <path d="M9 25.5587L11.1487 24.1953C11.317 24.7026 11.9713 25.638 12.9205 25.638C13.8698 25.638 14.3557 24.663 14.3557 24.1953V15.0002H16.9982V24.1953C17.041 25.4636 16.3376 28.0002 13.2332 28.0002C10.379 28.0002 9.19242 26.3039 9 25.5587Z" fill="#3E3E3E"></path> </g></svg></div>
        </div>
      </div>
      <div class="leagueBlock" id="nlBlock">
        <div id="leagueNL"></div>
        <div class="branches">
          <div class="spine2" id="spineNL2"></div>
          <div class="col" id="colLeftNL"></div>
          <div class="spine" id="spineNL"></div>
          <div class="col" id="colRightNL"></div>
        </div>
      </div>
    </div>
  </div>
</div></div>
</main>
<script>
/* ---------------------------------------------------------------------
 * blue palette + small render helpers
 * ------------------------------------------------------------------- */
const pal=Array(6).fill("#4a6cb3");   // box colour
const LINE="#2d4f9c";                   // wire / arrow colour
const P=s=>s.split("|");
let jsonIconSeq=0;
const jsonIcon=()=>{
  const a="jgA"+(jsonIconSeq),b="jgB"+(jsonIconSeq++);
  return `<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid"><defs><linearGradient x1="15.7913036%" y1="14.7370493%" x2="91.0087401%" y2="85.2281246%" id="${a}"><stop stop-color="#000000" offset="0%"/><stop stop-color="#FFFFFF" offset="100%"/></linearGradient><linearGradient x1="82.1356665%" y1="85.2373953%" x2="-3.11315442%" y2="14.7900497%" id="${b}"><stop stop-color="#000000" offset="0%"/><stop stop-color="#FFFFFF" offset="100%"/></linearGradient></defs><path d="M127.78336,190.559312 C184.419648,267.767856 239.846672,169.00968 239.765248,109.620512 C239.668928,39.402832 168.499792,0.158608 127.73696,0.158608 C62.309088,0.158608 0,54.232336 0,128.216032 C0,210.449632 71.424608,255.999984 127.73696,255.999984 C114.993808,254.165184 72.52704,245.065664 71.956288,147.253152 C71.572496,81.098592 93.5364,54.668336 127.64472,66.294672 C128.408608,66.577984 165.266992,81.117888 165.266992,128.61552 C165.266992,175.911392 127.78336,190.559312 127.78336,190.559312 L127.78336,190.559312 Z" fill="url(#${a})"/><path d="M127.717232,66.241296 C90.293152,53.342288 44.4484,84.186592 44.4484,145.967392 C44.4484,246.84416 119.20128,255.999984 128.263056,255.999984 C193.690928,255.999984 256,201.926256 256,127.94256 C256,45.70896 184.575392,0.158608 128.263056,0.158608 C143.860032,-2.001392 212.328448,17.038464 212.328448,110.617488 C212.328448,171.64336 161.203872,204.865424 127.951696,190.670992 C127.187808,190.38768 90.329424,175.847776 90.329424,128.350144 C90.329424,81.054272 127.717232,66.241296 127.717232,66.241296 L127.717232,66.241296 Z" fill="url(#${b})"/></svg>`;
};
const seg=(t,sub,c,w,on)=>`<div class="seg${on?" on":""}" style="--c:${c};--w:${w}"><b>${t}</b>${sub?`<em>${sub}</em>`:""}</div>`;

/* ---------------------------------------------------------------------
 * top diagram: decade / 5-year / example-year rows + the two leagues
 * ------------------------------------------------------------------- */
document.getElementById("decades").innerHTML='<div class="tl">'+[
  ["1980–1990","1 decade (10 years)",10],
  ["1990–2000","1 decade (10 years)",10],
  ["2000–2010","1 decade (10 years)",10],
  ["2010–2020","1 decade (10 years)",10],
  ["2020–2022","0.2 decades (2 years)",4]
].map((d,i)=>seg(d[0],"",pal[i],d[2])).join("")+'</div>';

document.getElementById("ranges").innerHTML='<div class="tl" style="min-width:920px">'+[
  "1980–1985","1985–1990","1990–1995","1995–2000","2000–2005",
  "2005–2010","2010–2015","2015–2020","2020–2022"
].map((r,i)=>seg(r,"",pal[i>>1],i==8?4:5,false)).join("")+'</div>';

document.getElementById("subyears").innerHTML='<div class="years sub">'+
  ["2001","2002","2003","2004","2005"].map(y=>`<span${y==="2003"?' style="color:var(--fg);font-weight:500"':''}>${y}</span>`).join("")+'</div>';

document.getElementById("divisions").innerHTML='<div class="years">'+
  ["West","Central","East"].map(d=>`<span${d==="Central"?' style="color:var(--fg);font-weight:500"':''}>${d}</span>`).join("")+'</div>';

document.getElementById("leagueAL").innerHTML=`<div class="leagues"><div class="league" style="--c:${pal[2]}">American League</div></div>`;
document.getElementById("leagueNL").innerHTML=`<div class="leagues"><div class="league" style="--c:${pal[3]}">National League</div></div>`;

/* ---------------------------------------------------------------------
 * schema data (Lahman-style baseball stat groups)
 * ------------------------------------------------------------------- */
const PITCH=P("Air outs|At bats|Batting average|Balks|Walks|Batters faced|Blown saves|Catcher's interference|Caught stealing|Caught stealing percentage|Complete games|Doubles|Earned runs|Earned run average|Games finished|Games pitched|Games started|Grounded into double play|Ground outs|Ground outs to air outs ratio|Hit by pitch|Hits|Hits per 9 innings|Holds|Home runs|Home runs per 9 innings|Inherited runners|Inherited runners scored|Innings pitched|Intentional walks|Losses|Number of pitches|On-base percentage|On-base plus slugging|Outs|Pickoffs|Pitches per inning|Runs|Runs scored per 9 innings|Sacrifice bunts|Sacrifice flies|Save opportunities|Saves|Shutouts|Slugging percentage|Stolen base percentage|Stolen bases|Strikeouts|Strike percentage|Strikeout-to-walk ratio|Strikeouts per 9 innings|Strikes|Total bases|Triples|Walks per 9 innings|Walks plus hits per inning pitched|Wild pitches|Winning percentage|Wins");
const FIELD=P("Age|Assists|Catcher earned run average|Catcher's interference|Caught stealing|Caught stealing percentage|Chances|Double plays|Errors|Fielding percentage|Games played|Games started|Innings|Passed balls|Pickoffs|Position|Put outs|Range factor per 9 innings|Range factor per game|Stolen base percentage|Stolen bases|Throwing errors|Triple plays|Wild pitches");
const HIT=P("Age|Air outs|At bats|At bats per home run|Batting average|Batting average on balls in play|Walks|Catcher's interference|Caught stealing|Caught stealing percentage|Doubles|Games played|Grounded into double play|Ground outs|Ground outs to air outs ratio|Hit by pitch|Hits|Home runs|Intentional walks|Left on base|Number of pitches|On-base percentage|On-base plus slugging|Plate appearances|Runs batted in|Runs|Sacrifice bunts|Sacrifice flies|Slugging percentage|Stolen base percentage|Stolen bases|Strikeouts|Total bases|Triples");

const DATA=[
  ["Game",P("Attendance|Away score|Date|Game type|Home score|Status|Venue name at the time")],
  ["Teams",[["Level",P("Active|Current name|Division|ID|League|Name history (past names only)|Trophies")],["Trophies",P("Division titles|Pennants|Wild cards|World Series")]]],
  ["Players",P("Debut date|Status|Bat side|Birth date|Death date|Height|Last active season|Pitch hand|Weight")],
  ["Managers",P("First season managed|Last season managed|Status")],
  ["Player-stats",[["Pitching stats",PITCH],["Fielding stats",FIELD],["Hitting stats",HIT]]],
  ["Rosters",P("Year|Teams")],
  ["Manager-stats",P("Manager ID|Team ID")],
  ["Awards",P("Player|Team")],
  ["Transactions",[["File info",P("Version|Year|Month")],["Transaction fields",P("Date|Type code|Player ID|Player name|From team ID|To team ID|Description")],["Transaction types",P("Signed as Free Agent|Selected|Designated for Assignment|Number Change|Assigned|Trade|Released|Outrighted|Claimed Off Waivers|Status Change")]]],
  ["Standings",P("Clinched|Division|Division rank|Losses|Winning percentage|Wins")],
  ["Standings-splits",[["Splits",P("Home|Away|Left|Left home|Left away|Right|Right home|Right away|Last ten games|Extra-inning games|One-run games|Day games|Night games|Grass|Turf")],["Expected record",P("Expected win-loss record|Expected win-loss record for the season")]]],
  ["Drafts",P("Player name|Bats (left, right or switch)|Throws (left or right)|Round|Overall pick number|Team ID|Position|School|Birth date|Height|Weight")]
];

/* ---------------------------------------------------------------------
 * tree DOM builder — each node is either a leaf string or [label, children]
 * ------------------------------------------------------------------- */
const countItems=arr=>arr.reduce((s,it)=>s+(typeof it==="string"?1:countItems(it[1])),0);

function item(it){
  const l=document.createElement("li");
  if(typeof it==="string"){
    l.innerHTML=`<span class="n">${it}</span>`;
  }else{
    l.className="grp gopen";
    l.innerHTML=`<span class="n g" tabindex="0" role="button" aria-expanded="true">${it[0]}</span>`;
    const h=l.firstChild;
    const toggle=()=>{const open=l.classList.toggle("gopen");h.setAttribute("aria-expanded",String(open));wire()};
    h.onclick=e=>{e.stopPropagation();toggle()};
    h.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}};
    l.append(list(it[1]));
  }
  return l;
}

// only one "more" panel is ever open at a time; closeOpenMore() is called
// from the global scroll/mousemove-away listeners set up near start()
let openMore=null;
function closeOpenMore(){
  if(!openMore)return;
  const {li,btn,n}=openMore;
  li.classList.remove("open");
  btn.textContent="More";btn.title="Show "+n+" more";btn.setAttribute("aria-expanded","false");
  openMore=null;
  wire();
}

function list(items){
  const ul=document.createElement("ul");
  items.slice(0,4).forEach(it=>ul.append(item(it)));
  if(items.length>4){
    const extra=items.slice(4),n=extra.length;
    const m=document.createElement("li"),b=document.createElement("button"),ex=document.createElement("ul");
    m.className="m";ex.className="extra";
    extra.forEach(it=>ex.append(item(it)));
    b.textContent="More";b.title="Show "+n+" more";b.setAttribute("aria-expanded","false");
    b.onclick=()=>{
      const wasOpen=m.classList.contains("open");
      closeOpenMore();
      if(!wasOpen){
        m.classList.add("open");
        b.textContent="Less";b.title="Show fewer";b.setAttribute("aria-expanded","true");
        openMore={li:m,btn:b,n};
      }
      wire();
    };
    // leaving the panel area (up, down, or sideways) closes it, same as scrolling
    m.onmouseleave=()=>{if(openMore&&openMore.li===m)closeOpenMore()};
    m.append(b,ex);ul.append(m);
  }
  return ul;
}

/* ---------------------------------------------------------------------
 * category cards: rendered twice in full (once for American League, once
 * for National League), each copy split into a left/right pair of plain
 * flex columns - no absolute positioning, no shared state between copies.
 * ------------------------------------------------------------------- */
function syncPad(){
  document.getElementById("scroll").classList.toggle("pad",!!document.querySelector(".cat:not(.off)"));
}
function closeCats(except){
  document.querySelectorAll(".cat:not(.off)").forEach(c=>{
    if(c===except)return;
    c.classList.add("off");
    c.querySelector(":scope>.n").setAttribute("aria-expanded","false");
  });
  syncPad();
}
function renderCats(leftId,rightId,iconSide){
  const colLeft=document.getElementById(leftId), colRight=document.getElementById(rightId);
  const half=Math.ceil(DATA.length/2);
  // the icon-bearing column is always the one that sits next to the hub, so
  // the first half of categories (starting with "Game") lands there for
  // BOTH leagues - which side that physically is depends on iconSide
  const hubCol=iconSide==="right"?colRight:colLeft, outerCol=iconSide==="right"?colLeft:colRight;
  DATA.forEach((c,i)=>{
    const l=document.createElement("div");
    l.className="cat off";l.style.setProperty("--c",pal[i%6]);
    const n=document.createElement("span");
    n.className="n";n.tabIndex=0;n.setAttribute("role","button");n.setAttribute("aria-expanded","false");
    n.innerHTML=`<i class="d"></i>${c[0]}`;
    const toggle=()=>{const closed=l.classList.toggle("off");if(!closed){
        closeCats(l);l.classList.remove("up");syncPad();
        const ul=l.querySelector(":scope>ul"),sb=document.getElementById("scroll").getBoundingClientRect();
        if(ul.getBoundingClientRect().bottom>sb.bottom-20)l.classList.add("up");
      }else syncPad();
      n.setAttribute("aria-expanded",String(!closed));wire()};
    n.onclick=toggle;
    n.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}};
    l.append(n,list(c[1]));
    const inHub=i<half, target=inHub?hubCol:outerCol;
    if(inHub){
      const row=document.createElement("div");
      row.className="catRow";
      const ic=document.createElement("div");
      ic.className="ibox";ic.innerHTML=jsonIcon();
      row.append(iconSide==="right"?l:ic,iconSide==="right"?ic:l);
      target.append(row);
    }else{
      target.append(l);
    }
  });
}
renderCats("colLeftAL","colRightAL","right");
renderCats("colLeftNL","colRightNL","left");

/* ---------------------------------------------------------------------
 * one wiring pass for the whole page, all drawn into the same <svg id="wires">:
 * title -> decades -> 5-year ranges -> year -> American/National League ->
 * SVG-icon box -> spine -> each category card, split left/right of it.
 * ------------------------------------------------------------------- */
function wire(){
  const inner=document.getElementById("inner"), top=document.getElementById("top"),
        ib=inner.getBoundingClientRect(), tb=top.getBoundingClientRect(),
        D=[...document.querySelectorAll("#decades .seg")],
        R=[...document.querySelectorAll("#ranges .seg")],
        SY=[...document.querySelectorAll("#subyears span")],
        fan=document.getElementById("fan"),
        pt=(e,bot)=>{const b=e.getBoundingClientRect();return[b.left-ib.left+b.width/2,(bot?b.bottom:b.top)-ib.top]},
        edge=(e,side)=>{const b=e.getBoundingClientRect();return[(side==="right"?b.right:b.left)-ib.left,b.top-ib.top+b.height/2]};
  if(!D.length||!R.length)return;

  const fb=fan.getBoundingClientRect(), ox=fb.left-ib.left+fb.width/2, oy=fb.top-ib.top+46;
  const place=(id,px,py)=>{const c=document.getElementById(id);c.style.left=(px+ib.left-tb.left)+"px";c.style.top=(py+ib.top-tb.top-9)+"px"};
  place("cap1",ox,oy);

  // arrow=true draws a small triangle at the endpoint instead of a dot, for
  // the connectors that specifically need to read as directional
  const curve=(x1,y1,x2,y2,c,arrow)=>{
    const m=(y1+y2)/2;
    const end=arrow
      ? `<polygon points="${x2-4},${y2-7} ${x2+4},${y2-7} ${x2},${y2}" fill="${c}"/>`
      : `<circle cx="${x2}" cy="${y2}" r="3" fill="${c}"/>`;
    return `<path d="M${x1} ${y1}C${x1} ${m} ${x2} ${m} ${x2} ${y2}" stroke="${c}"${arrow?' style="stroke-width:2;opacity:.9"':''}/>${end}`;
  };
  // straight connector for the two "one line per league" wires into the hub
  const hline=(x1,y,x2,c)=>`<path d="M${x1} ${y}L${x2} ${y}" stroke="${c}" style="stroke-width:2;opacity:.9"/><circle cx="${x2}" cy="${y}" r="3.5" fill="${c}"/>`;

  let p=`<path d="M${ox} ${fb.top-ib.top}V${oy}" stroke=LINE style="opacity:1"/><circle cx="${ox}" cy="${oy}" r="4" fill="${LINE}"/>`;
  D.forEach((d,i)=>{const [x,y]=pt(d,0);p+=curve(ox,oy,x,y,LINE)});

  // decades -> 5-year ranges: each decade wires straight down to the exact
  // 1-2 range segments it spans (same color, arrowhead), so the hand-off
  // reads as a clean split rather than a shared funnel point
  const dB=D.map(d=>pt(d,1)), rT=R.map(r=>pt(r,0)),
        mx=((dB[1][0]+rT[3][0])/2+(dB[2][0]+rT[4][0])/2)/2, my=(dB[0][1]+rT[0][1])/2+18;
  dB.forEach(([x,y],i)=>{
    p+=`<circle cx="${x}" cy="${y}" r="3" fill="${LINE}"/>`;
    (i<4?[i*2,i*2+1]:[8]).forEach(ri=>{const [rx,ry]=rT[ri];p+=curve(x,y,rx,ry,LINE,true)});
  });
  place("cap2",mx,my);

  // 2000-2005 range -> the five single-year chips (2001-2005) under it
  if(R[4]&&SY.length){
    const [r4x,r4y]=pt(R[4],1);
    p+=`<circle cx="${r4x}" cy="${r4y}" r="3" fill="${LINE}"/>`;
    SY.forEach(sy=>{const [x,y]=pt(sy,0);p+=curve(r4x,r4y,x,y,LINE,true)});
  }

  // 2003 chip -> West / Central / East division boxes
  const DIV=[...document.querySelectorAll("#divisions span")];
  const sy2003=SY.find(el=>el.textContent.trim()==="2003");
  if(sy2003&&DIV.length){
    const [yx,yy]=pt(sy2003,1);
    p+=`<circle cx="${yx}" cy="${yy}" r="3" fill="${LINE}"/>`;
    DIV.forEach(d=>{const [dx,dy]=pt(d,0);p+=curve(yx,yy,dx,dy,LINE,true)});
  }

  // Central division -> American League / National League headers
  const leagueAL=document.querySelector("#leagueAL .league"),
        leagueNL=document.querySelector("#leagueNL .league"),
        yearFan=document.getElementById("yearFan"),
        central=DIV.find(d=>d.textContent.trim()==="Central");
  if(central&&leagueAL&&leagueNL&&yearFan){
    const [cx,cy]=pt(central,1), yfb=yearFan.getBoundingClientRect(), oy2=yfb.top-ib.top+yfb.height/2;
    p+=`<circle cx="${cx}" cy="${cy}" r="3" fill="${LINE}"/><path d="M${cx} ${cy}V${oy2}" stroke="${LINE}" style="stroke-width:1.5;opacity:1"/><circle cx="${cx}" cy="${oy2}" r="4" fill="${LINE}"/>`;
    [leagueAL,leagueNL].forEach(el=>{const [x,y]=pt(el,0);p+=`<path d="M${cx} ${oy2}H${x}V${y}" stroke="${LINE}" style="stroke-width:1.5;opacity:1"/><circle cx="${x}" cy="${y}" r="3" fill="${LINE}"/>`});
  }

  // inside each league: header -> spine -> every section card, so every
  // section reads as connected to every other section in that league
  const wireLeague=(headerEl,spineId,leftId,rightId,c)=>{
    const spine=document.getElementById(spineId);
    if(!headerEl||!spine)return;
    const [hx,hy]=pt(headerEl,1), sb=spine.getBoundingClientRect(), sx=sb.left-ib.left+sb.width/2;
    const cats=[...document.querySelectorAll(`#${leftId} .cat, #${rightId} .cat`)];
    if(!cats.length)return;
    const ys=cats.map(el=>edge(el,"left")[1]), topY=Math.min(...ys), botY=Math.max(...ys);
    p+=`<path d="M${sx} ${hy}V${topY}" stroke="${c}" style="stroke-width:2;opacity:.9"/><circle cx="${sx}" cy="${topY}" r="3.5" fill="${c}"/>`;
    p+=`<path d="M${sx} ${topY}V${botY}" stroke="${c}" style="stroke-width:2;opacity:.35"/>`;
    [...document.querySelectorAll(`#${leftId} .cat`)].forEach(el=>{
      const [ex,ey]=edge(el,"right");
      p+=`<path d="M${sx} ${ey}L${ex} ${ey}" stroke="${c}" style="opacity:.55"/><circle cx="${ex}" cy="${ey}" r="3" fill="${c}"/>`;
    });
    [...document.querySelectorAll(`#${rightId} .cat`)].forEach(el=>{
      const [ex,ey]=edge(el,"left");
      p+=`<path d="M${sx} ${ey}L${ex} ${ey}" stroke="${c}" style="opacity:.55"/><circle cx="${ex}" cy="${ey}" r="3" fill="${c}"/>`;
    });
  };
  wireLeague(leagueAL,"spineAL","colLeftAL","colRightAL",LINE);
  wireLeague(leagueNL,"spineNL","colLeftNL","colRightNL",LINE);

  // outer decoration spine: connects each icon box straight down to the
  // next one, only in the gap between them, so the boxes read as a
  // vertical chain without the line ever crossing over a box's face
  const wireOuter=colId=>{
    const icons=[...document.querySelectorAll(`#${colId} .ibox`)]
      .map(el=>el.getBoundingClientRect())
      .sort((a,b)=>a.top-b.top);
    if(icons.length<2)return;
    const sx=icons[0].left-ib.left+icons[0].width/2;
    for(let i=0;i<icons.length-1;i++){
      const y1=icons[i].bottom-ib.top, y2=icons[i+1].top-ib.top;
      p+=`<path d="M${sx} ${y1}V${y2}" stroke=LINE style="stroke-width:2;opacity:.9"/>`;
    }
  };
  wireOuter("colLeftNL");
  wireOuter("colRightAL");

  // icon box -> the one section card it sits beside, at the icon's own
  // vertical position (the card is taller than the icon, so this lands
  // near the top of the card rather than at the card's midpoint)
  const wireIconToCard=(colId,iconPos,c)=>{
    const icSide=iconPos==="left"?"right":"left", cardSide=iconPos==="left"?"left":"right";
    [...document.querySelectorAll(`#${colId} .catRow`)].forEach(row=>{
      const ic=row.querySelector(".ibox"), card=row.querySelector(".cat");
      if(!ic||!card)return;
      const [ix,iy]=edge(ic,icSide), cb=card.getBoundingClientRect(),
            cx=(cardSide==="left"?cb.left:cb.right)-ib.left;
      p+=`<path d="M${ix} ${iy}L${cx} ${iy}" stroke="${c}" style="stroke-width:2;opacity:.85"/><circle cx="${ix}" cy="${iy}" r="2.5" fill="${c}"/><circle cx="${cx}" cy="${iy}" r="3" fill="${c}"/>`;
    });
  };
  wireIconToCard("colLeftNL","left",LINE);
  wireIconToCard("colRightAL","right",LINE);

  // CORE box: placed at the upper center, vertically aligned with the top
  // row of icon boxes (the Game row), horizontally centered between the
  // two leagues. Wired to the top icon box of each league.
  const coreBox=document.getElementById("coreBox"),
        alBlock=document.getElementById("alBlock"), nlBlock=document.getElementById("nlBlock"),
        iconsAL=[...document.querySelectorAll("#colRightAL .ibox")],
        iconsNL=[...document.querySelectorAll("#colLeftNL .ibox")];
  if(coreBox&&alBlock&&nlBlock&&iconsAL.length&&iconsNL.length){
    const ab=alBlock.getBoundingClientRect(), nb=nlBlock.getBoundingClientRect(),
          allIconRects=[...iconsAL,...iconsNL].map(el=>el.getBoundingClientRect()),
          iconsTop=Math.min(...allIconRects.map(b=>b.top)), iconsBot=Math.max(...allIconRects.map(b=>b.bottom)),
          cx=(ab.right+nb.left)/2-ib.left, cy=(iconsTop+iconsBot)/2-ib.top,
          cb=coreBox.getBoundingClientRect();
    coreBox.style.left=(cx-cb.width/2)+"px";
    coreBox.style.top=(cy-cb.height/2)+"px";

    // each league gets ONE vertical bus line beside its icon boxes (on the side
    // facing the core); every icon box ties into it with a short horizontal,
    // and a single horizontal runs from the bus into the core box
    const [clx,cly]=edge(coreBox,"left"), [crx,cry]=edge(coreBox,"right");
    const bus=(icons,side,coreX,coreY)=>{
      const pts=icons.map(ic=>edge(ic,side));
      const bx=side==="right"?Math.max(...pts.map(q=>q[0]))+34:Math.min(...pts.map(q=>q[0]))-34;
      const ys=pts.map(q=>q[1]), y1=Math.min(...ys,coreY), y2=Math.max(...ys,coreY);
      p+=`<path d="M${bx} ${y1}V${y2}" stroke="${LINE}" style="stroke-width:2;opacity:.9"/>`;
      pts.forEach(([ix,iy])=>{
        p+=`<path d="M${ix} ${iy}H${bx}" stroke="${LINE}" style="stroke-width:2;opacity:.9"/><circle cx="${ix}" cy="${iy}" r="3" fill="${LINE}"/><circle cx="${bx}" cy="${iy}" r="3" fill="${LINE}"/>`;
      });
      p+=`<path d="M${bx} ${coreY}H${coreX}" stroke="${LINE}" style="stroke-width:2;opacity:.9"/><circle cx="${bx}" cy="${coreY}" r="3.5" fill="${LINE}"/><circle cx="${coreX}" cy="${coreY}" r="3.5" fill="${LINE}"/>`;
    };
    bus(iconsAL,"right",clx,cly);
    bus(iconsNL,"left",crx,cry);
  }

  document.getElementById("wires").innerHTML=p;
}

function start(){
  wire();
  const sc=document.getElementById("scroll");
  sc.scrollLeft=(sc.scrollWidth-sc.clientWidth)/2;
}
start();
document.addEventListener("click",e=>{
  if(openMore&&!openMore.li.contains(e.target))closeOpenMore();
  if(!e.target.closest(".cat"))closeCats();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCats()});
addEventListener("resize",wire);
document.fonts&&document.fonts.ready.then(wire);
</script>
</body>
