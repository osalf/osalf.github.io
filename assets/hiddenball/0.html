<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--bg:#d2d6dd;--fg:#1c2430;--mute:#5f6979;--line:#ccc;--chip:#eef2f6;--ink:#2d4f9c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;min-height:100dvh;padding:56px 28px 96px}
svg{display:block;width:100%;max-width:448px;height:auto;font:inherit}
.box{fill:color-mix(in srgb,var(--c) 11%,var(--chip))}
.top{fill:none;stroke:var(--c);stroke-width:3}
.t{fill:var(--fg);font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.m{fill:var(--fg);font-size:15px;font-weight:600;text-anchor:start;dominant-baseline:central}
.w{fill:none;stroke-width:2;opacity:.9}
.lk{cursor:pointer}
.lk .box{fill:#2d4f9c;transition:fill .15s ease}
.lk .top{stroke:#234087}
.lk:hover .box{fill:#234087}
.lt{fill:#fff;pointer-events:none}
a:focus-visible{outline:2px solid #234087;outline-offset:3px}
@media (max-width:520px){
  body{padding:32px 16px 56px}
  .t,.m{font-size:17px}
}
</style>
</head>
<body>
<svg viewBox="36 96 448 516" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipeline: 1980–2022 blueprint, MNL, 2023 onward blueprint, with a dashed loop connecting the two blueprints">
  <defs>
    <marker id="a0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#234087"/></marker><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2d4f9c"/></marker><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2d4f9c"/></marker><marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d8ac4"/></marker><marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9db0d6"/></marker><marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2d4f9c"/></marker>
  </defs>

  <!-- dashed loop connecting DATABASE 1 and DATABASE 2 -->
  <path d="M390 142H430A40 40 0 0 1 470 182V482A40 40 0 0 1 430 522H390M130 142H90A40 40 0 0 0 50 182V482A40 40 0 0 0 90 522H130" fill="none" stroke="#8197c8" stroke-width="2" stroke-dasharray="7 5"/>
  <!-- vertical connectors -->
  <path class="w" d="M260 174V298" stroke="#2d4f9c" marker-end="url(#a1)"/><path class="w" d="M260 490V370" stroke="#2d4f9c" marker-end="url(#a2)"/>


  <!-- boxes -->
  <a href="d.html" aria-label="1980 – 2022 blueprint"><g class="lk" style="--c:#2d4f9c"><rect class="box" x="130" y="110" width="260" height="64" rx="8"/><path class="top" d="M130 118Q130 110 138 110H382Q390 110 390 118"/></g>
  <text class="t lt" x="260" y="142">1980 – 2022 blueprint</text></a>

  <g style="--c:#4a6cb3"><rect class="box" x="150" y="300" width="220" height="68" rx="8"/><path class="top" d="M150 308Q150 300 158 300H362Q370 300 370 308"/></g>
  <text class="t" x="260" y="334">Hidden Ball</text>

  <a href="etl.html" aria-label="2023 – ∞ blueprint"><g class="lk" style="--c:#2d4f9c"><rect class="box" x="130" y="490" width="260" height="64" rx="8"/><path class="top" d="M130 498Q130 490 138 490H382Q390 490 390 498"/></g>
  <text class="t lt" x="260" y="522">2023 – ∞ blueprint</text></a>

  <text class="t" x="260" y="592">ETL pipeline</text>
</svg>
</body>
</html>
