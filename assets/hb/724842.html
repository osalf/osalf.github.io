.box{fill:color-mix(in srgb,var(--c) 11%,var(--chip))}
.top{fill:none;stroke:var(--c);stroke-width:3}
.t{fill:var(--fg);font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.lab{fill:var(--mute);font-size:14px;text-anchor:start;dominant-baseline:central}
.w{fill:none;stroke-width:2;opacity:.9}
.ok .box{fill:#d6f0da}
.bad .box{fill:#fadcdc}
.lk .box{fill:#2d4f9c}

.lt{fill:#fff}
a{cursor:pointer}
a .box{transition:fill .15s ease}
a:hover .lk .box{fill:#234087}
a:focus-visible{outline:2px solid #234087;outline-offset:3px}
/* plain */
:root{--bg:#fff;--chip:#fff;--fg:#222;--mute:#666;--line:#888}
html,body{background:#fff}
body{font-family:Arial,Helvetica,sans-serif}
svg{font-family:Arial,Helvetica,sans-serif}
.box{fill:#fff;stroke:#333;stroke-width:1;rx:3px;ry:3px}
.top,.lk .top{stroke:none}
.ok .box{fill:#e6f4e8;stroke:#333}
.bad .box{fill:#fbe9e8;stroke:#333}
.lk .box{fill:#fff;stroke:#1a4fd8;stroke-width:1.5}
.lk:hover .box,a:hover .lk .box{fill:#eef3ff}
.lt{fill:#1a4fd8;text-decoration:underline}
.w{stroke:#444;stroke-width:1.5;opacity:1}
marker path{fill:#444}
