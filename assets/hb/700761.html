<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Data pipeline – game check flow</title>
<style>
:root{--bg:#d2d6dd;--fg:#1c2430;--mute:#5f6979;--line:#ccc;--chip:#eef2f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:56px 28px}
svg.dg{width:100%;max-width:1240px;height:auto;font:inherit;display:block}
.box{fill:color-mix(in srgb,var(--c) 11%,var(--chip))}
.top{fill:none;stroke:var(--c);stroke-width:3}
.t{fill:var(--fg);font-weight:600;text-anchor:middle;dominant-baseline:central}
.lab{fill:var(--mute);font-size:14px;text-anchor:start;dominant-baseline:central}
.w{fill:none;stroke-width:2;opacity:.9}
.ok .box{fill:#d6f0da}
.bad .box{fill:#fadcdc}
.vm{position:relative;isolation:isolate;box-sizing:border-box;width:100%;max-width:1462px;padding:24px 16px 20px;display:flex;flex-direction:column;align-items:center}
.vmbg{position:absolute;left:0;top:0;width:100%;height:100%;z-index:-1;pointer-events:none;overflow:visible;max-width:none}
.ring-wrap{width:100%;position:relative}
.ring{position:absolute;left:0;top:0;transform-origin:0 0}
@media(max-width:700px){body{padding:40px 8px}.vm{padding:12px 4px 12px}}
/* radial tree */
#radial{position:absolute;left:0;top:0;max-width:none;z-index:0}
#radial text{font-family:Arial,Helvetica,sans-serif}
#radial .lf{font-size:10.5px;fill:#333}
#radial .ct{font-size:12.5px;font-weight:700;fill:#111}
#radial g.leaf:hover .lf{font-weight:700}
#core{position:absolute;z-index:2;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:24px;background:#fff;border:1.5px solid #000;border-radius:6px;white-space:nowrap}
#core .bx{flex:none;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border:1px solid #333;border-radius:3px;background:#fff;font-weight:600;color:var(--fg)}
#core .lb{width:240px;height:56px;font-size:20px}
#core .z{width:80px;height:44px;font-size:15px;background:#e6f4e8}
#core .hx{width:60px;height:44px}
#core .hx svg{width:auto;max-width:none;height:28px;display:block}
#core .ar{flex:none;display:block;width:10px;max-width:none}
/* plain */
:root{--bg:#fff;--chip:#fff;--fg:#222;--mute:#666;--line:#888}
html,body{background:#fff}
body{font-family:Arial,Helvetica,sans-serif}
svg{font-family:Arial,Helvetica,sans-serif}
.box{fill:#fff;stroke:#333;stroke-width:1;rx:3px;ry:3px}
.top,.lk .top{stroke:none}
.ok .box{fill:#e6f4e8;stroke:#333}
.bad .box{fill:#fbe9e8;stroke:#333}
.lk .box{fill:#fff;stroke:#1a4fd8;stroke-width:1.5}
.lk:hover .box,a:hover .lk .box{fill:#eef3ff}
.lt{fill:#1a4fd8;text-decoration:underline}
.w{stroke:#444;stroke-width:1.5;opacity:1}
marker path{fill:#444}
</style>
</head>

ess","Splits by pitcher handedness"]],["Game metrics",["Win probability at every play","Win probability added (WPA)","Leverage index","Run expectancy (RE24)","Base-out state","WAR contribution","wOBA","wRC+","FIP","xFIP","Other sabermetric numbers","Expected stats: xBA","Expected stats: xSLG","Expected stats: xERA","Pitch sequencing metrics","Pitch tunneling metrics","Plate discipline: chase rate","Plate discipline: whiff rate","Plate discipline: zone rate","Umpire strike zone accuracy","Umpire strike zone consistency"]],["Decisions and rulings",["Balls and strikes called","Safe/out calls","Fair/foul calls","Checked swing calls","Interference rulings","Obstruction rulings","Ground-rule doubles","Protests filed","Ejections with reasons"]],["Transactions",["Injuries during the game","Injured list moves","Call-ups around the game","Send-downs around the game","Milestones (e.g., 500th home run, first career hit)","Records set or broken"]],["Timing and pace",["Game length","Time between pitches","Time between batters","Pitcher pace","Pitch clock violations","Mound visit counts","Inning break lengths"]]];
  var vm=document.getElementById("vm"),bg=document.getElementById("vmbg"),fp=document.getElementById("vmp"),
      rw=document.getElementById("rw"),ring=document.getElementById("ring"),core=document.getElementById("core");
  var DW=1430,DH=1408,rad=Math.PI/180;
  function f1(n){return n.toFixed(1)}
  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

  /* ---------- radial tree (same recipe as 538786.html) ----------
     Game example -> core box -> category dots (ring RC) -> elbow arc (ring RM) -> leaf dots (ring RL)
     Long labels wrap onto two lines and take two slots. */
  function build(){
    var GAP=14, SPAN=360-GAP, SLOT=13.5, CG=4.5, RC=270, RM=450, MAXW=250;
    var ctx=document.createElement("canvas").getContext("2d");
    ctx.font="10.5px Arial,Helvetica,sans-serif";
    function mw(s){return ctx.measureText(s).width}
    function wrap(s){
      if(mw(s)<=MAXW)return [s];
      var w=s.split(" "),best=[s],bm=1e9;
      for(var i=1;i<w.length;i++){
        var a=w.slice(0,i).join(" "),b=w.slice(i).join(" "),m=Math.max(mw(a),mw(b));
        if(m<bm){bm=m;best=[a,b]}
      }
      return best;
    }
    var cats=DATA.map(function(c){return{n:c[0],leaves:c[1].map(function(s){
      var L=wrap(s);return{lines:L,w:L.length,lw:Math.max.apply(null,L.map(mw))};
    })}});
    var T=0;
    cats.forEach(function(c,i){if(i)T+=CG;c.leaves.forEach(function(l){T+=l.w})});
    var a=SPAN/T, RL=Math.max(RM+150,SLOT/(a*rad));

    var cur=-90+GAP/2, hw=0, hh=0;
    cats.forEach(function(c,i){
      if(i)cur+=CG*a;
      c.leaves.forEach(function(l){
        l.phi=cur+a*l.w/2; cur+=a*l.w;
        var d=RL+8+l.lw, co=Math.abs(Math.cos(l.phi*rad)), si=Math.abs(Math.sin(l.phi*rad));
        hw=Math.max(hw,d*co+12*si); hh=Math.max(hh,d*si+12*co);
      });
      c.phi=(c.leaves[0].phi+c.leaves[c.leaves.length-1].phi)/2;
    });
    var W=Math.ceil(2*(hw+24)), H=Math.ceil(2*(hh+24)), cx=W/2, cy=H/2;

    function pol(r,f){return [cx+r*Math.cos(f*rad),cy+r*Math.sin(f*rad)]}
    function ln(r1,f,r2,w,o){var p=pol(r1,f),q=pol(r2,f);return '<path d="M'+f1(p[0])+' '+f1(p[1])+'L'+f1(q[0])+' '+f1(q[1])+'" stroke="#000" stroke-width="'+w+'" opacity="'+o+'" fill="none"/>'}
    function arc(r,fa,fb,w,o){if(Math.abs(fb-fa)<.01)return"";var p=pol(r,fa),q=pol(r,fb);return '<path d="M'+f1(p[0])+' '+f1(p[1])+'A'+r+' '+r+' 0 0 1 '+f1(q[0])+' '+f1(q[1])+'" stroke="#000" stroke-width="'+w+'" opacity="'+o+'" fill="none"/>'}
    function dot(r,f,rr){var p=pol(r,f);return '<circle cx="'+f1(p[0])+'" cy="'+f1(p[1])+'" r="'+rr+'" fill="#000"/>'}
    function txt(r,f,lines,cls,dy){
      var p=pol(r,f), left=Math.cos(f*rad)<0, rot=left?f+180:f;
      var o='<text class="'+cls+'" transform="translate('+f1(p[0])+' '+f1(p[1])+') rotate('+f1(rot)+')" text-anchor="'+(left?"end":"start")+'">';
      if(lines.length===1)o+='<tspan x="0" dy="'+dy+'">'+esc(lines[0])+'</tspan>';
      else o+='<tspan x="0" dy="-2.3">'+esc(lines[0])+'</tspan><tspan x="0" dy="11.5">'+esc(lines[1])+'</tspan>';
      return o+'</text>';
    }

    var o="";
    cats.forEach(function(c){
      var ps=c.leaves.map(function(l){return l.phi});
      o+=ln(0,c.phi,RC,1.6,.5)+ln(RC,c.phi,RM,1.6,.8)+arc(RM,ps[0],ps[ps.length-1],1.4,.8);
      c.leaves.forEach(function(l){
        o+=ln(RM,l.phi,RL,1,.5);
        o+='<g class="leaf">'+dot(RL,l.phi,2.6)+txt(RL+8,l.phi,l.lines,"lf",3.5)+'</g>';
      });
      o+=dot(RC,c.phi,5.5)+txt(RC+9,c.phi,[c.n],"ct",-5);
    });
    // Game example -> core box
    var top=cy-core.offsetHeight/2;
    o+='<path d="M'+f1(cx)+' 0V'+f1(top-7)+'" stroke="#000" stroke-width="2" fill="none"/>'+
       '<polygon points="'+f1(cx-4)+','+f1(top-7)+' '+f1(cx+4)+','+f1(top-7)+' '+f1(cx)+','+f1(top)+'" fill="#000"/>';

    ring.style.width=W+"px";ring.style.height=H+"px";
    core.style.left=cx+"px";core.style.top=cy+"px";
    ring.insertAdjacentHTML("afterbegin",'<svg id="radial" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+o+'</svg>');
    DW=W;DH=H;
    rw.style.maxWidth=W+"px";vm.style.maxWidth=(W+32)+"px";
  }

  /* ---------- fit to width ---------- */
  function fit(){var s=Math.min(1,rw.clientWidth/DW);ring.style.transform="scale("+s+")";rw.style.height=(DH*s)+"px";}

  /* ---------- dashed frame ---------- */
  function draw(){
    var W=vm.clientWidth,H=vm.clientHeight,k=Math.min(1,rw.clientWidth/DW),a=110*k,b=40*k,o=k,x1=W-o,y1=H-o;
    fp.setAttribute("stroke-width",2*k);fp.setAttribute("stroke-dasharray",(7*k)+" "+(5*k));
    fp.setAttribute("d","M"+(o+a)+" "+o+"H"+(x1-a)+"A"+a+" "+a+" 0 0 1 "+x1+" "+(o+a)+"V"+(y1-b)+"A"+b+" "+b+" 0 0 1 "+(x1-b)+" "+y1+"H"+(o+b)+"A"+b+" "+b+" 0 0 1 "+o+" "+(y1-b)+"V"+(o+a)+"A"+a+" "+a+" 0 0 1 "+(o+a)+" "+o+"Z");
    bg.setAttribute("viewBox","0 0 "+W+" "+H);
  }

  build();fit();draw();
  window.addEventListener("resize",function(){fit();draw()});
  window.addEventListener("load",function(){fit();draw()});
  if(window.ResizeObserver)new ResizeObserver(draw).observe(vm);
})();

</script>
